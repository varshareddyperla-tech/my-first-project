<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediNarrate Workspace</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 600px;
            width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: #2c3e50;
            margin: 10px 0;
            font-size: 28px;
        }
        .badge {
            background-color: #3498db;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #34495e;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 20px;
            font-family: inherit;
        }
        textarea:focus {
            border-color: #3498db;
            outline: none;
        }
        button {
            width: 100%;
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #27ae60;
        }
        .output-box {
            margin-top: 30px;
            padding: 15px;
            background-color: #f8f9fa;
            border-left: 4px solid #3498db;
            border-radius: 4px;
            display: none;
        }
        .output-box h3 {
            margin-top: 0;
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span class="badge">CLINICAL DOCUMENTATION ASSISTANT</span>
            <h1>MediNarrate</h1>
        </div>

        <label for="rawNotes">Enter Patient Consultation Notes:</label>
        <textarea id="rawNotes" placeholder="Example: Patient reports mild chest pain for 2 days. No shortness of breath. BP 120/80..."></textarea>

        <button onclick="generateNarrative()">Generate Professional Narrative</button>

        <div id="outputContainer" class="output-box">
            <h3>Formatted Clinical Narrative</h3>
            <p id="outputTxt"></p>
        </div>
    </div>

    <script>
        function generateNarrative() {
            const rawText = document.getElementById('rawNotes').value;
            const outputContainer = document.getElementById('outputContainer');
            const outputTxt = document.getElementById('outputTxt');

            if (rawText.trim() === "") {
                alert("Please enter some notes first!");
                return;
            }

            // A simple front-end formatting simulation for our assistant workspace
            let structuredText = rawText
                .replace(/(?:bp|blood pressure)\s*([\d\/]+)/gi, '<strong>Blood Pressure:</strong> $1')
                .replace(/(?:pain)\s*/gi, '<strong>Symptom:</strong> Pain ');

            outputTxt.innerHTML = `<strong>[Generated Narrative Summary]:</strong><br><br>` + structuredText;
            outputContainer.style.display = 'block';
        }
    </script>

</body>
</html>
